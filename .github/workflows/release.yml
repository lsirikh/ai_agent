name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    name: Desktop agent (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test clients/dotnet/EdgeVoice.Agent.sln -c Release
      - name: Publish single-file exe
        run: >
          dotnet publish clients/dotnet/src/EdgeVoice.Agent.Desktop/EdgeVoice.Agent.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath EdgeVoice.Agent-${{ github.ref_name }}-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: EdgeVoice.Agent-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true

  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, rag, orchestrator, wake_word, audio_gateway, embedding, stt, tts]
    steps:
      - name: Free disk space (CUDA images)
        if: matrix.service == 'stt' || matrix.service == 'tts' || matrix.service == 'embedding'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/edgevoice-${SERVICE//_/-}" >> "$GITHUB_OUTPUT"
        env:
          SERVICE: ${{ matrix.service }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
